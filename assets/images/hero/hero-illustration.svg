<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="PathFinder LK IT Career Ecosystem Compass">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="440" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <!-- Subtle architectural grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="88" x2="640" y2="88"/>
    <line x1="0" y1="176" x2="640" y2="176"/>
    <line x1="0" y1="264" x2="640" y2="264"/>
    <line x1="0" y1="352" x2="640" y2="352"/>
    <line x1="128" y1="0" x2="128" y2="440"/>
    <line x1="256" y1="0" x2="256" y2="440"/>
    <line x1="384" y1="0" x2="384" y2="440"/>
    <line x1="512" y1="0" x2="512" y2="440"/>
  </g>
  <!-- Ambient radial glow -->
  <circle cx="320" cy="220" r="165" fill="url(#coreGlow)"/>
  <!-- Connecting vectors -->
  <g stroke="#334155" stroke-width="2" stroke-dasharray="4,4">
    <line x1="170" y1="90" x2="265" y2="175"/>
    <line x1="470" y1="90" x2="375" y2="175"/>
    <line x1="145" y1="220" x2="245" y2="220"/>
    <line x1="495" y1="220" x2="395" y2="220"/>
    <line x1="170" y1="350" x2="265" y2="265"/>
    <line x1="470" y1="350" x2="375" y2="265"/>
  </g>
  <!-- Central Compass Core -->
  <circle cx="320" cy="220" r="96" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="320" cy="220" r="72" fill="#0b1326" stroke="url(#accentGrad)" stroke-width="3.5"/>
  <polygon points="320,162 332,214 320,204 308,214" fill="#38bdf8"/>
  <polygon points="320,278 332,226 320,236 308,226" fill="#475569"/>
  <circle cx="320" cy="220" r="7" fill="#f8fafc"/>
  <!-- Top Left: Software & Full-Stack -->
  <g transform="translate(36, 52)">
    <rect width="154" height="68" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.75"/>
    <circle cx="24" cy="24" r="6" fill="#38bdf8"/>
    <text x="38" y="28" fill="#f8fafc" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700">Software &amp; Web</text>
    <text x="20" y="50" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">Java · React · Node</text>
  </g>
  <!-- Top Right: Data & AI -->
  <g transform="translate(450, 52)">
    <rect width="154" height="68" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.75"/>
    <circle cx="24" cy="24" r="6" fill="#10b981"/>
    <text x="38" y="28" fill="#f8fafc" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700">Data &amp; AI</text>
    <text x="20" y="50" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">SQL · Python · ML</text>
  </g>
  <!-- Middle Left: Cloud & DevOps -->
  <g transform="translate(22, 186)">
    <rect width="154" height="68" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.75"/>
    <circle cx="24" cy="24" r="6" fill="#06b6d4"/>
    <text x="38" y="28" fill="#f8fafc" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700">Cloud &amp; DevOps</text>
    <text x="20" y="50" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">AWS · Docker · CI/CD</text>
  </g>
  <!-- Middle Right: QA & Automation -->
  <g transform="translate(464, 186)">
    <rect width="154" height="68" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.75"/>
    <circle cx="24" cy="24" r="6" fill="#f59e0b"/>
    <text x="38" y="28" fill="#f8fafc" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700">QA Automation</text>
    <text x="20" y="50" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">Playwright · API Test</text>
  </g>
  <!-- Bottom Left: Cybersecurity -->
  <g transform="translate(36, 320)">
    <rect width="154" height="68" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="1.75"/>
    <circle cx="24" cy="24" r="6" fill="#f43f5e"/>
    <text x="38" y="28" fill="#f8fafc" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700">Cybersecurity</text>
    <text x="20" y="50" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">SIEM · Linux · SOC</text>
  </g>
  <!-- Bottom Right: UI/UX Design -->
  <g transform="translate(450, 320)">
    <rect width="154" height="68" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.75"/>
    <circle cx="24" cy="24" r="6" fill="#a855f7"/>
    <text x="38" y="28" fill="#f8fafc" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700">UI/UX Design</text>
    <text x="20" y="50" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">Figma · UX Research</text>
  </g>
</svg>
