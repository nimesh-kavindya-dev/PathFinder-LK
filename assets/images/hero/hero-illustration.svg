<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Students exploring IT career paths">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgGrad)"/>
  <!-- Central compass element -->
  <circle cx="300" cy="200" r="110" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6,6"/>
  <circle cx="300" cy="200" r="85" fill="#0f172a" stroke="#0ea5e9" stroke-width="4"/>
  <!-- Compass Needle -->
  <polygon points="300,130 312,195 300,185 288,195" fill="#38bdf8"/>
  <polygon points="300,270 312,205 300,215 288,205" fill="#64748b"/>
  <circle cx="300" cy="200" r="8" fill="#f8fafc"/>
  <!-- Nodes around compass -->
  <!-- Software Engineer node -->
  <g transform="translate(100, 90)">
    <rect width="130" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Software Eng.</text>
    <text x="65" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&lt;Code /&gt;</text>
  </g>
  <!-- Data Analyst node -->
  <g transform="translate(370, 90)">
    <rect width="130" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="65" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Data Analyst</text>
    <text x="65" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Insights &amp; SQL</text>
  </g>
  <!-- Cybersecurity node -->
  <g transform="translate(80, 250)">
    <rect width="130" height="60" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="65" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cybersecurity</text>
    <text x="65" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Defense &amp; Ops</text>
  </g>
  <!-- UI/UX Designer node -->
  <g transform="translate(390, 250)">
    <rect width="130" height="60" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="65" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">UI/UX Designer</text>
    <text x="65" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Design &amp; Wireframes</text>
  </g>
  <!-- Connecting lines -->
  <line x1="215" y1="135" x2="250" y2="165" stroke="#475569" stroke-width="1.5"/>
  <line x1="385" y1="135" x2="350" y2="165" stroke="#475569" stroke-width="1.5"/>
  <line x1="200" y1="265" x2="250" y2="235" stroke="#475569" stroke-width="1.5"/>
  <line x1="400" y1="265" x2="350" y2="235" stroke="#475569" stroke-width="1.5"/>
</svg>
